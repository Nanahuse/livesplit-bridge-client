[project]
name = "livesplit-bridge-client"
version = "0.6.0"
description = "Python client for LiveSplit.Bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nanahuse" }]
dependencies = [
    "pydantic>=2.11,<3",
    "websocket-client>=1.8,<2",
]

[project.urls]
Repository = "https://github.com/Nanahuse/livesplit-bridge-client"
Protocol = "https://github.com/Nanahuse/LiveSplit.Bridge"

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "datamodel-code-generator==0.86.0",
    "pytest>=8,<10",
    "ruff==0.16.4",
    "ty==0.0.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livesplit_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/protocol-source.json",
    "/src",
    "/tests",
    "/tools/update_protocol.py",
    "/tools/protocol_names.json",
    "/tools/verify_distributions.py",
    "/tools/run_integration.py",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the official v4 Bridge TestHost"]

[tool.ruff]
extend-exclude = [".tmp"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.src]
include = ["src", "tests"]
