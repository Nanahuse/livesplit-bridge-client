[project]
name = "livesplit-bridge-client"
version = "0.2.0"
description = "Python client for LiveSplit.Bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nanahuse" }]
dependencies = [
    "protobuf>=6.31,<7",
    "pyzmq>=26,<28",
]

[project.urls]
Repository = "https://github.com/Nanahuse/livesplit-bridge-client"
Protocol = "https://github.com/Nanahuse/LiveSplit.Bridge"

[dependency-groups]
dev = [
    "grpcio-tools==1.75.1",
    "hatchling>=1.27,<2",
    "pytest>=8,<10",
    "ruff==0.16.4",
    "ty==0.0.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livesplit_bridge", "src/livesplit"]

[tool.hatch.build.targets.sdist]
include = [
    "/protocol-source.json",
    "/src",
    "/tests",
    "/tools/update_protocol.py",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/livesplit/bridge/v1"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.src]
include = ["src", "tests"]

[[tool.ty.overrides]]
include = ["src/livesplit/bridge/v1/**"]

[tool.ty.overrides.rules]
# Generated by grpcio-tools; the enum stubs cannot satisfy the metaclass rule.
conflicting-metaclass = "ignore"
