name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Test library installed with uv add
        run: uv run tools/test_installed.py

  quality:
    name: Quality
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Lint
        run: uvx --from ruff==0.16.4 ruff check .

      - name: Format
        run: uvx --from ruff==0.16.4 ruff format --check .

      - name: Type-check source with generated protocol stubs
        run: uv run tools/typecheck.py

  distributions:
    name: Distributions
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: uv run tools/verify_distributions.py dist
